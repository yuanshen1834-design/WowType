[package]
name = "wowtype-app"
version = "0.1.0"
edition = "2021"
description = "WowType 独立版拼音输入法（不注入系统进程）"
license = "MIT OR Apache-2.0"

[[bin]]
name = "WowType"
path = "src/main.rs"

[dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
