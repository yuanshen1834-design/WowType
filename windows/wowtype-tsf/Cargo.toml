[package]
name = "wowtype-tsf"
version = "0.1.0"
edition = "2021"
description = "WowType Windows TSF 文本服务（拼音输入法外壳）"
license = "MIT OR Apache-2.0"

[lib]
name = "wowtype_tsf"
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.62"
windows-registry = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_TextServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Graphics_Gdi",
] }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
